############################################################
# Docs — API reference and coverage
#
# Purpose
# - Generate JSDoc into docs/jsdoc/ (skipped unless apiDocs input is true)
# - Download the coverage report from the latest successful CI run and
#   publish it under docs/coverage/ (skipped unless coverage input is true)
# - Publish each to gh-pages under its own destination_dir, isolated from
#   architecture-docs.yml's output
#
# Triggers
# - Dispatched by ci.yml's start-deploy-stage job with apiDocs/coverage
#   inputs from scripts/ci/runPipelineScope.js, only when at least one is
#   true (see ci.yml).
# - Manual via workflow_dispatch; both inputs default true so an ad-hoc
#   run always regenerates everything.
#
# gh-pages clobber guard: this workflow and architecture-docs.yml
# (docs-only lineage, triggers independently on docs/** pushes) both
# publish to gh-pages and could run concurrently. The job-level
# `gh-pages-deploy` concurrency group below is shared by name with
# architecture-docs.yml's job, serializing the two publishes without
# touching either workflow's top-level trigger concurrency.
# destination_dir additionally scopes each publish's cleanup to its own
# subdirectory, so neither run can delete the other's files.
#
# Coverage artifact: it's produced by a separate ci.yml run, and
# actions/download-artifact@v4 only searches the CURRENT run by default —
# so we use the gh CLI to locate the latest successful ci.yml run and
# download its artifact directly.
#
# Concurrency group: api-docs-pipeline, NOT shared with ci.yml or
# deploy.yml — see deploy.yml's header for the full root cause (a shared
# group let this workflow's queued run silently cancel deploy.yml's
# queued run every time, in production). Within api-docs-pipeline
# itself, a newer queued run replacing an older one is intentional: it
# reflects the latest push's scope, so superseding a stale queued run is
# correct, not a bug.
############################################################
name: Docs — API reference and coverage

on:
  workflow_dispatch:
    inputs:
      apiDocs:
        description: 'Rebuild JSDoc API reference'
        type: boolean
        default: true
      coverage:
        description: 'Republish the coverage report'
        type: boolean
        default: true

concurrency:
  group: api-docs-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by peaceiris/actions-gh-pages to push to gh-pages
      actions: read      # required to query workflow runs and download artifacts from ci.yml
    # Shared across workflows by name — see "gh-pages clobber guard" above.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node setup
        uses: ./.github/actions/node-setup

      # ── JSDoc ── Generates API reference from src/ into docs/jsdoc/ (see jsdoc.json).
      - name: Generate JSDoc API docs
        if: inputs.apiDocs
        run: npm run docs:jsdoc

      # ── Coverage ──
      # If no successful CI run exists (e.g. very first run with no prior
      # CI history), the download step is skipped and the copy step below
      # leaves docs/coverage/ untouched for this run.
      - name: Find latest successful CI run
        id: ci-run
        if: inputs.coverage
        run: |
          RUN_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run found — coverage will not be published this run."
          else
            echo "Using coverage from CI run $RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # continue-on-error guards against artifact expiry (retention-days: 7 in ci.yml) or unavailability.
      - name: Download coverage artifact from CI run
        if: inputs.coverage && steps.ci-run.outputs.run-id != ''
        run: |
          gh run download "${{ steps.ci-run.outputs.run-id }}" \
            --name coverage-report \
            --dir docs/coverage/ \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Deploy ──────────────────────────────────────────────────────────
      # peaceiris/actions-gh-pages@v4 — use v4, not v3 (v3 has a known token
      # scope bug). destination_dir scopes both publish and stale-file
      # cleanup (keep_files defaults to false) to that one subdirectory —
      # nothing outside jsdoc/ or coverage/ on gh-pages is touched.
      - name: Publish JSDoc to gh-pages
        if: inputs.apiDocs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/jsdoc
          destination_dir: jsdoc
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "docs: rebuild JSDoc [${{ github.sha }}]"

      - name: Publish coverage to gh-pages
        if: inputs.coverage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/coverage
          destination_dir: coverage
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "docs: republish coverage report [${{ github.sha }}]"

      # gh-pages propagation can take up to 60 s after publish.
      # This step is informational — the workflow exits 0 regardless.
      - name: Smoke test gh-pages
        run: |
          echo "Waiting 15 s for gh-pages propagation..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://keglev.github.io/my-portfolio/jsdoc/index.html)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: gh-pages/jsdoc returned $STATUS — may still be propagating."
          fi
