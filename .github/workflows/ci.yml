############################################################
# CI — Lint, Test, Coverage
#
# Purpose
# - Lint source files to catch issues before tests run
# - Run the full test suite and collect coverage
# - Upload coverage as a pipeline artifact for coverage.yml
# - On push to main: resolve which downstream work actually changed
#   (scripts/ci/runPipelineScope.js) and dispatch deploy.yml and
#   coverage.yml in parallel — deploy always runs, coverage only when
#   source or test files could have changed the report.
#
# Triggers
# - Push to main when any workflow, source, test, or config file changes
#   (widened to .github/workflows/** so a change to deploy.yml or
#   coverage.yml alone still exercises the pipeline instead of sitting
#   untested until the next src/** push)
# - Pull requests to main (lint-and-test only, no dispatch)
#
# Does NOT deploy anything itself. Deployment and docs generation are
# dispatched to deploy.yml / coverage.yml, which run in parallel.
############################################################
name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      # The lockfile is what `npm ci` actually installs from, so a
      # lockfile-only change (a dependency bump, an `npm audit fix`) can
      # alter the deployed bundle and must not skip the pipeline. It was
      # missing here while package.json was listed, which meant exactly
      # that class of change deployed nothing.
      - 'package-lock.json'
      # Build inputs: a change to either can alter the deployed bundle, so
      # neither may skip the pipeline. index.html moved to the repo root with
      # the Vite migration; under CRA it lived in public/ and was not listed.
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/**'
  # Every PR runs the full lint-and-test gate, docs-only PRs included.
  # Skipping them would need a paths-ignore here plus a twin no-op workflow
  # reporting the same required-check name (so branch protection still passes),
  # and the suite is short enough that the simpler topology wins. Decision
  # recorded in ADR-010.
  pull_request:
    branches: [ main ]

# One pipeline at a time. Queues instead of cancelling.
concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node setup
        uses: ./.github/actions/node-setup

      # Fail fast: lint before running tests.
      - name: Lint
        run: npm run lint

      # Dependency gate. Runs in lint-and-test, which has no path filter on
      # pull_request, so every PR passes through it -- including a
      # dependency PR that touches nothing but package.json and the
      # lockfile. Placed before the test run because a high or critical
      # advisory is not a result worth spending three minutes of test time
      # to reach.
      #
      # This step can fail on a commit that changed nothing, when an
      # advisory is published upstream against a dependency already in the
      # tree. That is the gate working: the response is to upgrade, or to
      # add a waiver to the allowlist in scripts/audit-check.js naming the
      # dependency path and why it cannot reach a user.
      - name: Audit dependencies
        run: npm run audit:ci

      - name: Run tests with coverage
        env:
          CI: true
        # test:coverage is the single source of truth for the instrumented
        # run (vitest run --coverage). All configuration -- environment,
        # setup file, coverage provider, include/exclude, reporters -- lives
        # in vite.config.js's `test` block, so this step carries no flags of
        # its own and cannot drift from a local run.
        run: npm run test:coverage

      # Upload coverage so coverage.yml can consume it without re-running tests.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Runs only on push to main after lint-and-test passes.
  start-deploy-stage:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: scripts/ci/runPipelineScope.js diffs
          # github.event.before..github.sha, which needs both commits
          # reachable. A shallow (depth-1) checkout would make every
          # push look like an unresolvable range.
          fetch-depth: 0

      - name: Node setup
        uses: ./.github/actions/node-setup

      # Resolves which downstream work changed. If the range can't be
      # diffed (new branch: before is the all-zero SHA; force-push:
      # before was rewritten out of history), runPipelineScope.js fails
      # safe and reports every flag as true rather than skipping work.
      - name: Resolve pipeline scope
        id: scope
        run: node scripts/ci/runPipelineScope.js "${{ github.event.before }}" "${{ github.sha }}"

      # Gated on the deploy flag. That flag is false exactly when every
      # changed path is docs territory (docs/** or scripts/docs/**): such a
      # push changes no bundle input, so it must not trigger a Vercel
      # production deploy. Everything else -- src, config, lockfile, workflow
      # files -- flips deploy true and dispatches the build.
      - name: Trigger deploy workflow
        if: steps.scope.outputs.deploy == 'true'
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatched alongside deploy.yml (not after it) so build/deploy and
      # docs generation run in parallel instead of docs waiting on deploy.
      # No inputs: coverage.yml has one job now, so dispatching it IS the
      # instruction. The decision of whether to dispatch stays here.
      - name: Trigger the coverage workflow
        if: steps.scope.outputs.coverage == 'true'
        run: gh workflow run coverage.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
