############################################################
# Docs Refresh
#
# Purpose
# - Apply HTML/CSS doc templates (.md → .html via build_docs.js)
# - Pre-render Mermaid diagrams (build_mermaid.js; falls back to CDN
#   client-side rendering when mmdc is not installed)
# - Generate JSDoc API documentation into docs/jsdoc/
# - Download the coverage report from the latest successful CI run
#   and publish it under docs/coverage/ so the report is reachable
#   at https://keglev.github.io/my-portfolio/coverage/index.html
# - Publish everything in docs/ to gh-pages
#
# Triggers
# - Dispatched by build-and-fetch.yml after a successful Vercel deploy
# - Directly on docs/** or scripts/docs/** changes
#   (docs-only edits skip the full pipeline)
# - Manual via workflow_dispatch for ad-hoc doc rebuilds
#
# Deployment target: gh-pages only.
# Nothing in this workflow is deployed to Vercel.
#
# Coverage cross-run artifact note
# ---------------------------------
# The coverage report is generated and uploaded by ci.yml (a separate
# workflow run). actions/download-artifact@v4 only searches the CURRENT
# run by default, so a plain download step would always find nothing.
# Instead we use the gh CLI to locate the latest successful CI run and
# download its artifact directly.
############################################################
name: Docs Refresh

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
  workflow_dispatch:

# Full-pipeline runs share the portfolio-pipeline concurrency group so they
# queue behind build-and-fetch.yml and never overlap.
# Docs-only pushes use a separate group so they don't block the full pipeline.
concurrency:
  group: ${{ (github.event_name == 'push') && 'docs-only' || 'portfolio-pipeline' }}
  cancel-in-progress: false

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by peaceiris/actions-gh-pages to push to gh-pages
      actions: read     # required to query workflow runs and download artifacts from ci.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      # ── Doc templates ───────────────────────────────────────────────────
      # build_docs.js converts docs/*.md → docs/*.html using scripts/docs/templates/page.html
      # and copies scripts/docs/templates/hub.html → docs/index.html (visual landing page).
      #
      # marked must be installed before this step.
      # The inline install is a no-op once "marked" is committed to package-lock.json
      # via `npm install --save-dev marked` in the local dev environment.
      # It ensures CI works in the interim before the lockfile is updated.
      - name: Apply doc templates
        run: |
          node -e "require('marked')" 2>/dev/null || npm install --no-save marked@^9
          node scripts/docs/build_docs.js

      # ── Mermaid diagrams ────────────────────────────────────────────────
      # build_mermaid.js looks for mmdc (@mermaid-js/mermaid-cli) on PATH and
      # in node_modules/.bin. When not found it exits cleanly — diagrams in
      # the generated HTML pages are rendered client-side by the Mermaid CDN
      # script already included in scripts/docs/templates/page.html.
      #
      # To enable server-side pre-rendering in CI:
      #   npm install --save-dev @mermaid-js/mermaid-cli
      - name: Pre-render Mermaid diagrams
        run: node scripts/docs/build_mermaid.js

      # ── JSDoc ───────────────────────────────────────────────────────────
      # Generates API reference from src/ into docs/jsdoc/ (see jsdoc.json).
      - name: Generate JSDoc API docs
        run: npm run docs:jsdoc

      # ── Coverage ────────────────────────────────────────────────────────
      # The coverage report is produced by ci.yml and uploaded as the
      # "coverage-report" artifact. We resolve the latest successful CI run
      # with the gh CLI and download from it directly.
      #
      # If no successful CI run exists (e.g., very first docs-only push with
      # no prior CI run), the coverage steps are skipped and the previous
      # coverage on gh-pages is dropped by keep_files: false below.
      - name: Find latest successful CI run
        id: ci-run
        run: |
          RUN_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run found — coverage will not be published this run."
          else
            echo "Using coverage from CI run $RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gh run download fetches the named artifact from the specified run into
      # the local coverage/ directory. continue-on-error guards against the
      # artifact expiring (retention-days: 7 in ci.yml) or being unavailable.
      - name: Download coverage artifact from CI run
        if: steps.ci-run.outputs.run-id != ''
        run: |
          gh run download "${{ steps.ci-run.outputs.run-id }}" \
            --name coverage-report \
            --dir coverage/ \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Copy coverage report into docs
        run: |
          if [ -d coverage ]; then
            rm -rf docs/coverage
            cp -r coverage docs/coverage
            echo "Coverage report copied to docs/coverage/"
          else
            echo "No coverage data available — docs/coverage/ will not be included."
          fi

      # ── Deploy ──────────────────────────────────────────────────────────
      # peaceiris/actions-gh-pages@v4 — use v4, not v3 (v3 has a known token scope bug).
      # keep_files: false replaces all docs on each deploy so stale files do not accumulate.
      # force_orphan: false preserves git history on the gh-pages branch.
      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
          commit_message: "docs: rebuild templates and coverage [${{ github.sha }}]"

      # gh-pages propagation can take up to 60 s after publish.
      # This step is informational — the workflow exits 0 regardless of the result.
      - name: Smoke test gh-pages
        run: |
          echo "Waiting 15 s for gh-pages propagation..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://keglev.github.io/my-portfolio)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: gh-pages returned $STATUS — may still be propagating."
          fi
