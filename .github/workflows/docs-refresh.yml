############################################################
# Docs Refresh
#
# Purpose
# - Generate JSDoc API documentation
# - Generate Mermaid diagrams (placeholder until .mmd files exist)
# - Apply HTML/CSS doc templates (placeholder until templates exist)
# - Download coverage report from CI artifact (no re-running tests)
# - Publish everything to gh-pages
#
# Triggers
# - Dispatched by build-and-fetch.yml after successful Vercel deployment
# - Directly on docs/** changes (docs-only edits bypass the full pipeline)
# - Manual via workflow_dispatch
#
# Docs are published to gh-pages only.
# Nothing here is deployed to Vercel.
############################################################
name: Docs Refresh

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:

# Full pipeline runs use the shared group — queues behind build-and-fetch.
# Docs-only pushes use a separate group so they never queue behind a full run.
concurrency:
  group: ${{ (github.event_name == 'push') && 'docs-only' || 'portfolio-pipeline' }}
  cancel-in-progress: false

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      # Download coverage from CI artifact instead of re-running tests.
      # If the artifact is missing (docs-only trigger), this step is skipped
      # and the previous coverage on gh-pages remains unchanged.
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true

      - name: Generate JSDoc API docs
        run: |
          echo "Generating JSDoc into docs/jsdoc"
          npm run docs:jsdoc

      # Placeholder: runs once .mmd diagram files exist in the repo.
      - name: Generate Mermaid diagrams
        run: |
          echo "No Mermaid sources yet — skipping"
          # When ready, replace with:
          # npx @mermaid-js/mermaid-cli -i docs/diagrams/*.mmd -o docs/diagrams/

      # Placeholder: runs once HTML/CSS doc templates are created.
      - name: Apply doc templates
        run: |
          echo "No templates yet — skipping"
          # When ready, replace with the script that merges templates into docs/

      - name: Copy coverage report into docs
        run: |
          if [ -d coverage ]; then
            rm -rf docs/coverage
            cp -r coverage docs/coverage
            echo "Coverage report copied into docs/"
          else
            echo "No coverage artifact found — skipping coverage copy"
          fi

      # peaceiris/actions-gh-pages@v4 — v3 has a known token scope bug
      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: false   # replaces all docs on each deploy; old files do not accumulate
          force_orphan: false # preserves git history on gh-pages branch
          commit_message: "docs: update coverage and jsdoc [${{ github.sha }}]"

      # Confirm gh-pages is reachable after publish.
      - name: Smoke test gh-pages
        run: |
          echo "Checking gh-pages is reachable..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://keglev.github.io/my-portfolio)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: gh-pages returned $STATUS — may still be propagating"
          fi
        # Non-blocking warning only: gh-pages propagation can take up to 60s.
        # Exit 0 always to avoid failing the workflow on a timing issue.
