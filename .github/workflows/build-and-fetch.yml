############################################################
# Build and Fetch Projects
#
# Purpose
# - Fetch repository READMEs and documentation links for the portfolio
# - Post-process and normalize links for offline use
# - Run a production build of the React site
# - Deploy the built app to Vercel (no test files, no docs)
#
# Triggers
# - Dispatched by ci.yml after all tests pass (push to main only)
# - Manual via workflow_dispatch for ad-hoc builds or debugging
#
# Design notes
# - Tests must pass before this workflow runs. Deployment is blocked
#   if CI fails.
# - Security-sensitive values are provided through repository secrets.
#   The workflow never prints secret values.
# - Steps are idempotent where possible.
############################################################
name: Build and Fetch Projects

on:
  workflow_dispatch:

# Same concurrency group as ci.yml — queues behind it, never overlaps.
concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      # Refreshing projects.json from GitHub is best-effort. The portfolio cards
      # render from src/data/projects.config.js (static), and RepoDocs falls back
      # to the committed public/projects.json snapshot. A token/network failure
      # here must never block a deploy.
      - name: Fetch GitHub pinned projects
        id: fetch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_SECRET: ${{ secrets.DEEPL_SECRET }}
        run: |
          echo "Running fetchProjects.js (DeepL used only if secret present)"
          node -e "console.log('DeepL present?', !!process.env.DEEPL_SECRET || !!process.env.DEEPL_API_KEY)"
          node scripts/fetchProjects.js

      # The next three steps only make sense on a fresh fetch. If the fetch was
      # skipped or failed, the committed projects.json snapshot is used as-is.
      # Fallback runs before post-processing so all data is complete before normalization.
      - name: Fallback README doc-scan
        if: github.event_name != 'pull_request' && steps.fetch.outcome == 'success'
        run: node scripts/applyFallbackDocScan.js

      - name: Post-process fetched projects
        if: github.event_name != 'pull_request' && steps.fetch.outcome == 'success'
        run: node scripts/postprocessProjects.js

      - name: Verify projects.json contents
        if: github.event_name != 'pull_request' && steps.fetch.outcome == 'success'
        run: node scripts/verifyProjects.js

      # Test files are never included — CRA only compiles src/.
      - name: Build
        run: npm run build

      - name: Prepare Vercel prebuilt output
        run: bash scripts/prepareVercelOutput.sh

      - name: Verify prebuilt static artifacts
        run: |
          ls -la .vercel/output/static || true
          if [ -f .vercel/output/static/projects.json ]; then
            echo "projects.json size:" $(stat -c%s .vercel/output/static/projects.json)
          else
            echo "ERROR: projects.json not found in prebuilt output"; exit 1;
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel --prod --token "$VERCEL_TOKEN" --yes --prebuilt .

      # Confirm the deployed app is reachable before triggering docs.
      - name: Smoke test Vercel deployment
        run: |
          echo "Checking Vercel deployment is reachable..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://carloskeglevich.vercel.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Vercel deployment returned $STATUS"; exit 1;
          fi

      - name: Trigger docs-refresh workflow
        run: gh workflow run docs-refresh.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}