############################################################
# Deploy — build and publish to Vercel
#
# Purpose
# - Run a production build of the React site
# - Deploy the built app to Vercel (no test files, no docs)
#
# Note: this workflow does not fetch project data from GitHub. The
# Projects section is 100% static, hand-curated content
# (src/data/projects.config.js); the old build-time GitHub-fetch pipeline
# was retired because nothing in the render path consumed its output.
#
# Triggers
# - Dispatched by ci.yml's start-deploy-stage job after lint-and-test
#   passes (push to main only) — dispatched at the same time as
#   api-docs.yml, not before or after it, so build/deploy and docs
#   generation run in parallel.
# - Manual via workflow_dispatch for ad-hoc builds or debugging
#
# Design notes
# - Tests must pass before this workflow runs. Deployment is blocked
#   if CI fails.
# - Security-sensitive values are provided through repository secrets.
#   The workflow never prints secret values.
# - Steps are idempotent where possible.
# - Does not trigger any docs workflow — ci.yml dispatches api-docs.yml
#   directly and independently.
#
# Concurrency group: deploy-pipeline, NOT shared with ci.yml or
# api-docs.yml. A shared group would make parallel dispatch impossible:
# GitHub Actions only protects an ALREADY IN-PROGRESS run from
# cancellation when cancel-in-progress: false — a run that is still
# QUEUED (not yet started) is not protected, and gets silently cancelled
# if a second run joins the same group's queue before the first one
# starts. ci.yml dispatches this workflow and api-docs.yml back to back
# while ci.yml's own run still holds "portfolio-pipeline"; if this
# workflow shared that group, the older-queued run of this workflow
# would lose to the newer-queued api-docs.yml run every time (this
# happened in production before the split — see the fix commit). Giving
# deploy.yml its own group removes that race entirely.
# Within deploy-pipeline itself, if two deploys somehow queue back to
# back, the SAME queued-run-replacement behavior applies — but here
# that's intentional, not a bug: every dispatch runs `--ref main`, so
# the newest queued run always builds the latest main, and skipping an
# now-superseded intermediate deploy is the correct outcome.
# One consequence accepted deliberately: a new push's ci.yml run can now
# overlap a still-running deploy of a previous push, since they no
# longer share a group. That's safe — ci.yml only lints, tests, and
# dispatches (it never touches Vercel or gh-pages), and deploys still
# self-serialize within deploy-pipeline. Do not "fix" this by putting
# ci.yml and deploy.yml back in the same group.
############################################################
name: Deploy — build and publish to Vercel

on:
  workflow_dispatch:

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node setup
        uses: ./.github/actions/node-setup

      # Test files are never included — CRA only compiles src/.
      # REACT_APP_* vars are baked in at build time. The app is built HERE (not
      # on Vercel — we deploy --prebuilt), so client env vars must be provided
      # as GitHub secrets on this step. The Web3Forms key is public by design.
      - name: Build
        env:
          REACT_APP_WEB3FORMS_KEY: ${{ secrets.REACT_APP_WEB3FORMS_KEY }}
        run: npm run build

      - name: Prepare Vercel prebuilt output
        run: bash scripts/prepareVercelOutput.sh

      - name: Verify prebuilt static artifacts
        run: |
          ls -la .vercel/output/static || true
          if [ ! -f .vercel/output/static/index.html ]; then
            echo "ERROR: index.html not found in prebuilt output"; exit 1;
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel --prod --token "$VERCEL_TOKEN" --yes --prebuilt .

      # Confirm the deployed app is reachable.
      - name: Smoke test Vercel deployment
        run: |
          echo "Checking Vercel deployment is reachable..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://carloskeglevich.vercel.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Vercel deployment returned $STATUS"; exit 1;
          fi