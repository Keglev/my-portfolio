############################################################
# Docs — architecture site
#
# Purpose
# - Apply HTML/CSS doc templates (.md -> .html via build_docs.js)
# - Pre-render Mermaid diagrams (build_mermaid.js; falls back to CDN
#   client-side rendering when mmdc is not installed)
# - Publish the result to gh-pages
#
# Triggers
# - Directly on docs/** or scripts/docs/** pushes to main. NOT dispatched
#   by ci.yml and NOT run after every deploy -- architecture content only
#   changes when someone edits docs/ or its templates. The docs half of the
#   pipeline split is expressed by this workflow's own `paths:` trigger below,
#   not by any scope flag
#   (see coverage.yml for the sibling coverage half of that split).
# - Manual via workflow_dispatch for ad-hoc rebuilds.
#
# Deployment target: gh-pages only. Nothing here touches Vercel.
#
# gh-pages clobber guard and the keep_files tradeoff
# ----------------------------------------------------
# coverage.yml publishes docs/coverage/ using destination_dir, which scopes
# cleanup to that one subdirectory. This workflow's output is NOT confined
# to one subdirectory -- it spans docs/index.html, docs/architecture/,
# docs/_theme/, docs/templates/, etc. at gh-pages root -- so destination_dir
# cannot express "everything except coverage/" in one publish step. We use
# keep_files: true instead, and publish a STAGED copy of docs/ with
# coverage/ excluded (not ./docs itself), so this workflow never overwrites
# coverage.yml's freshly published gh-pages/coverage/. (A jsdoc/ exclusion
# stood beside coverage/ until the Code Reference site was retired in
# ADR-009; docs/jsdoc/ no longer exists to stage.) keep_files: true also
# means a page removed from docs/ is never deleted from gh-pages by this
# workflow -- stale architecture pages must be cleaned up manually if a doc
# is ever deleted outright.
# The job-level `gh-pages-deploy` concurrency group is still shared with
# coverage.yml's job of the same name (GitHub Actions matches concurrency
# groups by name across workflows), so the two publishes never race even
# though this workflow's docs-only trigger is otherwise independent of
# the ci.yml-dispatched chain that reaches coverage.yml.
############################################################
name: Docs — architecture site

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
  workflow_dispatch:

# Always docs-only, regardless of trigger. Manual workflow_dispatch runs
# used to fall back to portfolio-pipeline, but portfolio-pipeline is now
# ci.yml's dedicated group (see deploy.yml's header for why shared groups
# cancel queued runs) — this workflow never needs to coordinate with
# ci.yml, deploy.yml, or coverage.yml, so it always uses its own group.
concurrency:
  group: docs-only
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by peaceiris/actions-gh-pages to push to gh-pages
    # Shared across workflows by name — see "gh-pages clobber guard" above.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node setup
        uses: ./.github/actions/node-setup

      # ── Doc build ────────────────────────────────────────────────────────
      # npm run docs:build is the single source of truth for this two-step
      # pipeline (also runnable locally): build_docs.js assembles
      # header.html + page.html + footer.html into the doc-page template,
      # converts docs/*.md → docs/*.html (skipping docs/jsdoc/, docs/coverage/,
      # and docs/_theme/), concatenates the split CSS source files under
      # docs/_theme/css/ into a single docs/_theme/css/styles.css, and
      # assembles header.html + landing-en.html/landing-de.html + footer.html
      # → docs/index.html and docs/index-de.html. build_mermaid.js then
      # looks for mmdc (@mermaid-js/mermaid-cli) on PATH and in
      # node_modules/.bin; when not found it exits cleanly and diagrams in
      # the generated HTML pages fall back to client-side rendering via the
      # Mermaid CDN script already included in docs/_theme/templates/page.html.
      # To enable server-side pre-rendering in CI: npm install --save-dev
      # @mermaid-js/mermaid-cli.
      #
      # marked must be installed before build_docs.js runs. The inline
      # install is a no-op once "marked" is committed to package-lock.json
      # via `npm install --save-dev marked` in the local dev environment.
      # It ensures CI works in the interim before the lockfile is updated.
      - name: Build docs (templates + Mermaid pre-render)
        run: |
          node -e "require('marked')" 2>/dev/null || npm install --no-save marked@^9
          npm run docs:build

      # docs/coverage/ is coverage.yml's territory; excluding it here keeps
      # keep_files: true below from clobbering that workflow's gh-pages
      # content should a coverage directory ever be present in this
      # workspace. The jsdoc exclude that stood beside it is gone: the
      # generated code reference is no longer committed, so there is nothing
      # under docs/jsdoc/ in this checkout to stage. See header comment.
      - name: Stage architecture docs (excludes coverage/)
        run: |
          rm -rf /tmp/gh-pages-arch
          mkdir -p /tmp/gh-pages-arch
          rsync -a --exclude 'coverage' docs/ /tmp/gh-pages-arch/

      # ── Deploy ──────────────────────────────────────────────────────────
      # peaceiris/actions-gh-pages@v4 — use v4, not v3 (v3 has a known token scope bug).
      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages-arch
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          commit_message: "docs: rebuild architecture site [${{ github.sha }}]"

      # gh-pages propagation can take up to 60 s after publish.
      # This step is informational — the workflow exits 0 regardless of the result.
      - name: Smoke test gh-pages
        run: |
          echo "Waiting 15 s for gh-pages propagation..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://keglev.github.io/my-portfolio)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: gh-pages returned $STATUS — may still be propagating."
          fi
