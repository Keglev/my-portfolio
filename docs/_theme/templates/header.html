<!--
  File: header.html
  Summary: Shared page shell (DOCTYPE, head, body open, site header)
    assembled into every generated docs page by build_docs.js via
    scripts/docs/lib/renderPages.js.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Replaced at build time: full page title set by each consumer (page vs. landing) -->
  <title>{{TITLE}}</title>

  <!-- Set the theme before paint to avoid a flash. Dark is the fallback
       default, mirroring src/context/ThemeContext.js's own no-storage
       fallback -- see docs/_theme/js/docs.js for the storage key. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("portfolio-docs-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Path adjusted at build time for pages nested below docs/ root (see adjustTemplate in scripts/docs/lib/renderPages.js) -->
  <link rel="stylesheet" href="_theme/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- --- Site header: breadcrumb + language switch + theme toggle + external nav --- -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__title" href="https://keglev.github.io/">Portfolio</a>
      <span class="site-header__sep">/</span>
      <!-- href adjusted at build time for subdirectory pages -->
      <a class="site-header__title" href="index.html">my-portfolio</a>
      <span class="site-header__sep">/</span>
      <span class="site-header__section">Docs</span>
      <div class="site-header__spacer"></div>
      <nav aria-label="Docs navigation">
        <ul class="site-header__nav">
          <!-- No trailing arrow glyph: U+2197 has an emoji presentation form and
               renders in colour on some platforms, which the zero-emoji rule for
               docs output excludes. target/rel already carry the "opens elsewhere"
               semantics for assistive tech. -->
          <li><a href="https://github.com/Keglev/my-portfolio" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
      </nav>
      <!-- Hrefs resolved at runtime by docs.js against the current page's translated twin, if any -->
      <span class="lang-switch">
        <a href="index.html" aria-current="true">EN</a>
        <a href="index-de.html">DE</a>
      </span>
      <button class="theme-toggle" aria-label="Toggle light or dark theme" title="Toggle light or dark theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none" />
        </svg>
      </button>
    </div>
  </header>
