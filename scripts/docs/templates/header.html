<!-- ─── Shared page shell: DOCTYPE, head, body open, site header ── -->
<!-- Assembled into every generated page by build_docs.js             -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Replaced at build time: full page title set by each consumer (page vs. hub) -->
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Path adjusted at build time for pages nested below docs/ root (see adjustTemplate in build_docs.js) -->
  <link rel="stylesheet" href="templates/styles.css" />
</head>
<body>

  <!-- ─── Site header: breadcrumb + external nav ──────────────── -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__title" href="https://keglev.github.io/">Portfolio</a>
      <span class="site-header__sep">/</span>
      <!-- href adjusted at build time for subdirectory pages -->
      <a class="site-header__title" href="index.html">my-portfolio</a>
      <span class="site-header__sep">/</span>
      <span class="site-header__section">Docs</span>
      <div class="site-header__spacer"></div>
      <nav aria-label="Docs navigation">
        <ul class="site-header__nav">
          <li><a href="https://github.com/Keglev/my-portfolio" target="_blank" rel="noopener">GitHub ↗</a></li>
        </ul>
      </nav>
    </div>
  </header>
