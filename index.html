    <div id="root"></div>

      Vite treats index.html as the entry module and resolves this script from
      it; public/ is now static passthrough only. The script tag is explicit --
      Vite does not inject one, unlike CRA's HtmlWebpackPlugin.
    -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
